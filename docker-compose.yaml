version: "3.8"

services:
  order-db:
    image: mongo:latest
    container_name: order-db
    restart: always
    networks:
      - orchestrator-saga
    env_file:
      - ./.env_dev
      - ./.env_prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
    ports:
      - "27017:27017"

  product-db:
    container_name: product-db
    image: postgres:latest
    env_file:
      - ./.env_dev
      - ./.env_prod
    environment:
      POSTGRES_DB: ${POSTGRES_PRODUCT_DB}
      POSTGRES_USER: ${POSTGRES_PRODUCT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PRODUCT_PASSWORD}
      PGDATA: ${POSTGRES_PRODUCT_DATA}
    networks:
      - orchestrator-saga
    ports:
      - "5432:5432"

  payment-db:
    container_name: payment-db
    image: postgres:latest
    env_file:
      - ./.env_dev
      - ./.env_prod
    environment:
      POSTGRES_DB: ${POSTGRES_PAYMENT_DB}
      POSTGRES_USER: ${POSTGRES_PAYMENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD}
      PGDATA: ${POSTGRES_PAYMENT_DATA}
    networks:
      - orchestrator-saga
    ports:
      - "5433:5432"


  inventory-db:
    container_name: inventory-db
    image: postgres:latest
    env_file:
      - ./.env_dev
      - ./.env_prod
    environment:
      POSTGRES_DB: ${POSTGRES_INVENTORY_DB}
      POSTGRES_USER: ${POSTGRES_INVENTORY_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INVENTORY_PASSWORD}
      PGDATA: ${POSTGRES_INVENTORY_DATA}
    networks:
      - orchestrator-saga
    ports:
     - "5434:5432"

  kafka:
    container_name: kafka
    image: obsidiandynamics/kafka
    restart: "no"
    ports:
      - "2181:2181"
      - "9092:9092"
    networks:
      - orchestrator-saga
    env_file:
      - ./.env_dev
      - ./.env_prod
    environment:
      KAFKA_LISTENERS: ${KAFKA_LISTENERS_HOST}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS_HOSTS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT: ${KAFKA_ZOOKEEPER_SESSION_TIMEOUT}
      KAFKA_RESTART_ATTEMPTS: "10"
      KAFKA_RESTART_DELAY: "5"
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: "0"
    volumes:
      - ./data/kafka/data:/var/lib/kafka/data

  redpanda-console:
    container_name: redpanda
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    restart: on-failure
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console
    ports:
      - "8081:8080"
    networks:
      - orchestrator-saga
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka: 
          brokers: ["kafka:29092"]
    depends_on:
      - kafka

  order_service:
    build: './order-service'
    container_name: order-service
    depends_on:
      - order-db
      - kafka
    networks:
      - orchestrator-saga
    env_file:
      - ./.env_dev
      - ./.env_prod
    environment:
      - KAFKA_BROKER=kafka:29092
      - MONGO_DB_URI=mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@order-db:27017
    ports:
      - "3000:3000"
  orchestrator-service:
    build: './orchestrator-service'
    container_name: orchestrator-service
    depends_on:
      - kafka
    networks:
      - orchestrator-saga
    environment:
      - KAFKA_BROKER=kafka:29092
    ports:
      - "8080:8080"

  product-validation-service:
    build: './product-validation-service'
    container_name: product-validation-service
    depends_on:
      - product-db
      - kafka
    networks:
      - orchestrator-saga
    env_file:
      - ./.env_dev
      - ./.env_prod
    environment:
      - KAFKA_BROKER=kafka:29092
      - DB_HOST=product-db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_INVENTORY_DB}
      - DB_USER=${POSTGRES_INVENTORY_USER}
      - DB_PASSWORD=${POSTGRES_INVENTORY_PASSWORD}
    ports:
      - "8090:8090"

  payment-service:
      build: './payment-service'
      container_name: payment-service
      depends_on:
        - payment-db
        - kafka
      networks:
        - orchestrator-saga
      environment:
        - KAFKA_BROKER=kafka:29092
        - DB_HOST=payment-db
        - DB_PORT=5432
        - DB_NAME=${POSTGRES_PAYMENT_DB}
        - DB_USER=${POSTGRES_PAYMENT_USER}
        - DB_PASSWORD=${POSTGRES_PAYMENT_PASSWORD}
      ports:
        - "8091:8091"

  inventory-service:
      build: './inventory-service'
      container_name: inventory-service
      depends_on:
        - inventory-db
        - kafka
      networks:
        - orchestrator-saga
      environment:
        - KAFKA_BROKER=kafka:29092
        - DB_HOST=inventory-db
        - DB_PORT=5432
        - DB_NAME=${POSTGRES_INVENTORY_DB}
        - DB_USER=${POSTGRES_INVENTORY_USER}
        - DB_PASSWORD=${POSTGRES_PAYMENT_PASSWORD}
      ports:
        - "8092:8092"

networks:
    orchestrator-saga:
      driver: bridge
