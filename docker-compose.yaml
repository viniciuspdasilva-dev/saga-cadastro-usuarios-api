services:
  order-db:
    image: mongo:latest
    container_name: order-db
    restart: always
    networks:
      orchestrator-saga:
        ipv4_address: 10.200.0.189
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
    ports:
      - "27017:27017"

  product-db:
    container_name: product-db
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_PRODUCT_DB}
      POSTGRES_USER: ${POSTGRES_PRODUCT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PRODUCT_PASSWORD}
      PGDATA: ${POSTGRES_PRODUCT_DATA}
    networks:
      orchestrator-saga:
        ipv4_address: 10.200.0.191
    ports:
      - "5432:5432"

  payment-db:
    container_name: payment-db
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_PAYMENT_DB}
      POSTGRES_USER: ${POSTGRES_PAYMENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD}
      PGDATA: ${POSTGRES_PAYMENT_DATA}
    networks:
      orchestrator-saga:
        ipv4_address: 10.200.0.192
    ports:
      - "5433:5432"

  zookeeper:
    image: 'confluentinc/cp-zookeeper:latest'
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      orchestrator-saga:
        ipv4_address: 10.200.0.180

  inventory-db:
    container_name: inventory-db
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_INVENTORY_DB}
      POSTGRES_USER: ${POSTGRES_INVENTORY_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INVENTORY_PASSWORD}
      PGDATA: ${POSTGRES_INVENTORY_DATA}
    networks:
      orchestrator-saga:
        ipv4_address: 10.200.0.193
    ports:
     - "5434:5432"


  kafka:
    container_name: kafka
    image: apache/kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    expose:
      - 9092
    networks:
      orchestrator-saga:
        ipv4_address: 10.200.0.194
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://10.200.0.194:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: "no"
