  jaeger:
    image: 'jaegertracing/jaeger:2.0.0'
    container_name: "jaeger"
    ports:
      - '5775:5775/udp'
      - '6831:6831/udp'
      - '6832:6832/udp'
      - '5778:5778'
      - '14268:14268'
      - '14250:14250'
      - '16686:16686'
    expose:
      - '5775'
      - '6831'
      - '6832'
      - '5778'
      - '14268'
      - '14250'
      - '16686'
    networks:
      orchestrator-saga:
        ipv4_address: 10.200.0.197

networks:
    orchestrator-saga:
      driver: bridge
      ipam:
        driver: default
        config:
          - subnet: 10.200.0.0/24
